<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link rel="stylesheet" href="../../static/css/variables.css">
    <link rel="stylesheet" href="../../static/css/reset.css">
    <link rel="stylesheet" href="../../static/css/hero.css">
    <link rel="stylesheet" href="../../static/css/typography.css">
    <link rel="stylesheet" href="../../static/css/layout.css">
    <link rel="stylesheet" href="../../static/css/register.css">
</head>

<body>
    <div class="register-container">
        <!-- <div class="brand">
            <img src="" alt="Sabify logo">
            <h3>Sabify</h3>
        </div> -->

        <div class="dashboard-brand">
            <span class="dashboard-brand-mark">
                LI
            </span>
            Learning Intelligence
        </div>
        <h3>Create Your Account</h3>
        <p class="subtitle">Sign in to access your learning dashboard and AI tutor</p>

        <form action="/register" method="post">
            <div class="field-group">
                <label for="signInAs">Sign in as</label>
                <select name="signInAs" id="signInAs">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <div class="field-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Full name" required>
            </div>

            <div class="field-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="field-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="policy" name="policy" required>
                <label for="policy">I agree to the Institutional Terms of Service, Academic Honor Code, Privacy
                    Policy.</label>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</body>

</html>
