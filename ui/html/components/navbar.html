{{ define "navbar" }}

<header class="site-header">

    <nav class="navbar">

        <div class="navbar-inner container">

            <!-- Brand -->
            <a
                href="/"
                class="navbar-brand"
                aria-label="Learning Intelligence home"
            >
                <span class="brand-mark">
                    <span class="brand-mark-dot"></span>
                    <span class="brand-mark-dot"></span>
                </span>

                <span class="brand-name">
                    Learning Intelligence
                </span>
            </a>


            <!-- Desktop Navigation -->
            <div class="navbar-center">

                <a
                    href="#features"
                    class="navbar-link"
                >
                    Features
                </a>

                <a
                    href="#how-it-works"
                    class="navbar-link"
                >
                    How it works
                </a>

                <a
                    href="#for-teachers"
                    class="navbar-link"
                >
                    For Teachers
                </a>

                <a
                    href="#for-students"
                    class="navbar-link"
                >
                    For Students
                </a>

            </div>


            <!-- Desktop Actions -->
            <div class="navbar-actions">

                <a
                    href="/login"
                    class="navbar-login"
                >
                    Log in
                </a>

                <a
                    href="/register"
                    class="navbar-cta"
                >
                    Get started

                    <span class="navbar-cta-arrow">
                        →
                    </span>
                </a>

            </div>


            <!-- Mobile Menu Button -->
            <button
                class="mobile-menu-button"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="mobile-navigation"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>


        <!-- Mobile Navigation -->
        <div
            id="mobile-navigation"
            class="mobile-navigation"
            aria-hidden="true"
        >

            <div class="mobile-navigation-inner">

                <a href="#features">
                    Features
                </a>

                <a href="#how-it-works">
                    How it works
                </a>

                <a href="#for-teachers">
                    For Teachers
                </a>

                <a href="#for-students">
                    For Students
                </a>


                <div class="mobile-navigation-actions">

                    <a
                        href="/login"
                        class="mobile-login"
                    >
                        Log in
                    </a>

                    <a
                        href="/register"
                        class="navbar-cta"
                    >
                        Get started
                        <span>→</span>
                    </a>

                </div>

            </div>

        </div>

    </nav>

</header>

{{ end }}
