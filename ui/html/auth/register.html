{{ define "body" }}

<div class="register-page">
    <div class="register-container">
        <!-- <div class="brand">
            <img src="" alt="Sabify logo">
            <h3>Sabify</h3>
        </div> -->

        <div class="dashboard-brand">
            <span class="dashboard-brand-mark">LI</span>
            Learning Intelligence
        </div>

        <h3>Create Your Account</h3>
        <!-- <p class="subtitle">Sign in to access your learning dashboard and AI tutor</p> -->

        <form action="/login" method="post">
            <div class="field-group">
                <label for="role">Signup as</label>
                <select name="role" id="role">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
            </div>

            <div class="field-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Full name" required>
            </div>

            <div class="field-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="field-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="policy" name="policy" required>
                <label for="policy">I agree to the Institutional Terms of Service, Academic Honor Code, Privacy
                    Policy.</label>
            </div>

            <button type="submit">Create Account</button>
        </form>

        <p class="switch">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>

{{ end }}
